name: Publish evidence explorer
on:
  push:
    branches: [main]
    paths: ['docs/**', 'releases/manifest.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble public documentation only
        run: |
          mkdir -p _site/docs _site/releases
          cp -R docs/. _site/docs/
          cp releases/manifest.json _site/releases/manifest.json
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=docs/explorer/">' > _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
